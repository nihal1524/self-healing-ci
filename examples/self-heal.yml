# Copy to .github/workflows/self-heal.yml in the repository you want healed.
#
# First, try it by hand: Actions tab -> "Self-heal" -> Run workflow (pick the failing branch).
# Once that works, enable the second trigger so it runs whenever your CI fails.
name: Self-heal

on:
  workflow_dispatch:
  # workflow_run:
  #   workflows: ["CI"]            # the name of your existing test workflow
  #   types: [completed]

permissions:
  contents: write         # push the self-healing/<branch> branch
  pull-requests: write    # open the PR

concurrency:
  group: self-heal-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # For the workflow_run trigger: only after a failure, and never on a self-healing branch (loop guard).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       !startsWith(github.event.workflow_run.head_branch, 'self-healing/'))
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: YOUR-ORG/self-healing-ci@v1
        with:
          test-cmd: pytest -q
          setup-cmd: pip install -r requirements.txt
          image: python:3.11
          branch: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Optional tracing:
          # langfuse-public-key: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          # langfuse-secret-key: ${{ secrets.LANGFUSE_SECRET_KEY }}
          # langfuse-base-url: https://jp.cloud.langfuse.com
