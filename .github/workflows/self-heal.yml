# This repository uses its own action ("dogfooding"): when CI fails on main, it tries to fix the tests
# and opens a self-healing/main pull request. Needs the repository secret ANTHROPIC_API_KEY
# (and optionally LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY) plus Settings -> Actions -> General ->
# "Allow GitHub Actions to create and approve pull requests".
name: Self-heal

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]            # only react to failures on main, to keep paid runs rare

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: self-heal-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       !startsWith(github.event.workflow_run.head_branch, 'self-healing/'))
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: ./                 # the action in this repository
        with:
          # The test that needs the host's Docker daemon cannot run inside the test container.
          test-cmd: >-
            python -m pytest -q
            --deselect tests/test_fixture_context.py::test_docker_runner_generates_junit_xml_report
          setup-cmd: pip install -r requirements.txt
          image: python:3.11
          max-attempts: "3"          # fix attempts before giving up (plus one final verification run)
          # Other settings (defaults in the action's action.yml): model, create-pr, fail-if-unhealed.
          branch: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          langfuse-public-key: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          langfuse-secret-key: ${{ secrets.LANGFUSE_SECRET_KEY }}
          langfuse-base-url: ${{ secrets.LANGFUSE_BASE_URL }}
